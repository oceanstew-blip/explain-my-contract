name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v2
        with:
          version: 2.109.0
          github-token: ${{ github.token }}
      - name: Authenticate container pulls
        run: echo "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Start local database
        run: |
          for attempt in 1 2 3; do
            if supabase db start; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Supabase failed to start after $attempt attempts."
              exit 1
            fi

            echo "Supabase start attempt $attempt failed; retrying in $((attempt * 20)) seconds."
            supabase stop --no-backup || true
            sleep "$((attempt * 20))"
          done
      - run: supabase test db --local
      - run: supabase db advisors --local
